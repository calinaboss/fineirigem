<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>timer irigemmm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="speed.png">
</head>
<body>

    <div class="contenitore-app">
        <div class="intestazione-brand">
            <div class="logo">I.R.I.GEM</div>
            
        </div>

        <div class="titolo-timer">INIZIO SCUOLA 14 sett 8:15 </div>
        <div class="timer-principale" id="timer-inizio">
            <div class="slot-tempo">
                <div id="giorni-inizio" class="numero">00</div>
                <div class="etichetta">GIORNI</div>
            </div>
            <div class="slot-tempo">
                <div id="ore-inizio" class="numero">00</div>
                <div class="etichetta">ORE</div>
            </div>
            <div class="slot-tempo">
                <div id="minuti-inizio" class="numero1">00</div>
                <div class="etichetta">MINUTI</div>
            </div>
            <div class="slot-tempo">
                <div id="secondi-inizio" class="numero1">00</div>
                <div class="etichetta">SECONDI</div>
            </div>
        </div>

        <div class="titolo-timer">FINE SCUOLA 12 giugno 8:15 forse</div>
        <div class="timer-principale" id="timer-fine">
            <div class="slot-tempo">
                <div id="giorni-fine" class="numero">00</div>
                <div class="etichetta">GIORNI</div>
            </div>
            <div class="slot-tempo">
                <div id="ore-fine" class="numero">00</div>
                <div class="etichetta">ORE</div>
            </div>
            <div class="slot-tempo">
                <div id="minuti-fine" class="numero1">00</div>
                <div class="etichetta">MINUTI</div>
            </div>
            <div class="slot-tempo">
                <div id="secondi-fine" class="numero1">00</div>
                <div class="etichetta">SECONDI</div>
            </div>
        </div>

        <div class="titolo-timer">RILASCIO GTA 6 19 novembre </div>
        <div class="timer-principale" id="timer-gta">
            <div class="slot-tempo">
                <div id="giorni-gta" class="numero">00</div>
                <div class="etichetta">GIORNI</div>
            </div>
            <div class="slot-tempo">
                <div id="ore-gta" class="numero">00</div>
                <div class="etichetta">ORE</div>
            </div>
            <div class="slot-tempo">
                <div id="minuti-gta" class="numero1">00</div>
                <div class="etichetta">MINUTI</div>
            </div>
            <div class="slot-tempo">
                <div id="secondi-gta" class="numero1">00</div>
                <div class="etichetta">SECONDI</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
