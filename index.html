<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>timer irigemmm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="speed.png">
</head>
<body>

    <div class="contenitore-app">
        <div class="intestazione-brand">
            <div class="logo">I.R.I.GEM</div>
            <h1>CONTEGGIO FINE SCUOLA</h1>
        </div>


        <div class="contenitore-filtri">
            <button id="btn-tutti" class="pulsante-filtro attivo" onclick="setMode('all')">TUTTI I GIORNI</button>
            
        </div>

        <div class="timer-principale">
            <div class="slot-tempo">
                <div id="display-giorni" class="numero">00</div>
                <div class="etichetta">GIORNI</div>
            </div>
            <div class="slot-tempo">
                <div id="display-ore" class="numero">00</div>
                <div class="etichetta">ORE</div>
            </div>
            <div class="slot-tempo">
                <div id="display-minuti" class="numero1">00</div>
                <div class="etichetta">MINUTI</div>
            </div>
            <div class="slot-tempo">
                <div id="display-secondi" class="numero1">00</div>
                <div class="etichetta">SECONDI</div>
            </div>
        </div>

  <div class="riquadro-riepilogo">
    
    <div class="elemento-stat">
         
        <span class="valore-stat">
            Inizio:  Settembre, 8:15 (per le terze maybe)
            
        </span>
        
    </div>
   
</div>


    <script src="script.js"></script>
</body>
</html>
